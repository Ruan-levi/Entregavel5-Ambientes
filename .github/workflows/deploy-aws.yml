name: Publicar site na AWS S3

# Ativacao manual ate a configuracao de IAM OIDC e S3 estar concluida.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar a aplicacao
        run: npm test && npm run build
      - name: Credenciais temporarias via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2
      - name: Enviar HTML ao S3
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: aws s3 cp index.html "s3://${BUCKET}/index.html" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
      - name: Enviar arquivos estaticos ao S3
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: aws s3 sync assets "s3://${BUCKET}/assets" --delete
