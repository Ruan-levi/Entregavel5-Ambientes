name: Entregavel 5 - CONQUEST (codigo completo)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-conquest:
    name: Testar e compilar Conquest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conquest
    steps:
      - name: Checkout dos arquivos da entrega
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conquest/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Testar logica, backend REST e SQLite
        run: npm test
      - name: Compilar frontend de producao
        run: npm run build
